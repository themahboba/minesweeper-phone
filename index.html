<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Minesweeper" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Minesweeper</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-label="Minesweeper game">
        <header class="topbar">
          <div class="brand">
            <span class="mine-mark" aria-hidden="true"></span>
            <h1>Minesweeper</h1>
          </div>
          <div class="top-actions">
            <button class="icon-button" id="settings-button" type="button" aria-label="Settings" title="Settings">
              <span aria-hidden="true">⚙</span>
            </button>
            <button class="icon-button" id="new-game" type="button" aria-label="New game" title="New game">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
        </header>

        <div class="stats" aria-label="Game status">
          <div class="stat">
            <span class="stat-label">Mines</span>
            <strong id="mine-count">000</strong>
          </div>
          <button class="face-button" id="face" type="button" aria-label="New game" title="New game">
            <span aria-hidden="true">:)</span>
          </button>
          <div class="stat">
            <span class="stat-label">Time</span>
            <strong id="timer">000</strong>
          </div>
        </div>

        <div class="controls" aria-label="Game controls">
          <label class="select-wrap">
            <span>Level</span>
            <select id="difficulty" aria-label="Difficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <button class="mode-button" id="flag-mode" type="button" aria-pressed="false">
            <span class="flag-icon" aria-hidden="true">⚑</span>
            <span>Flag mode</span>
          </button>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Minefield"></div>
        </div>

        <footer class="footer-strip">
          <span id="status">Ready</span>
          <span id="best-time">Best --</span>
        </footer>

        <section class="leaderboard" aria-label="Leaderboard">
          <div class="leaderboard-head">
            <h2>Leaderboard</h2>
            <button class="clear-button" id="clear-leaderboard" type="button">Clear</button>
          </div>
          <label class="name-wrap">
            <span>Name</span>
            <input id="player-name" type="text" maxlength="16" autocomplete="nickname" value="Player" />
          </label>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
        </section>
      </section>

      <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
        <form method="dialog" class="settings-card">
          <div class="settings-head">
            <h2 id="settings-title">Settings</h2>
            <button class="icon-button" id="close-settings" type="submit" aria-label="Close settings" title="Close">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <fieldset class="color-settings">
            <legend>Background colour</legend>
            <div class="swatch-grid" id="background-swatches">
              <button class="swatch swatch-night" type="button" data-bg-option="night" aria-pressed="false">
                <span></span>
                Night
              </button>
              <button class="swatch swatch-forest" type="button" data-bg-option="forest" aria-pressed="false">
                <span></span>
                Forest
              </button>
              <button class="swatch swatch-ocean" type="button" data-bg-option="ocean" aria-pressed="false">
                <span></span>
                Ocean
              </button>
              <button class="swatch swatch-berry" type="button" data-bg-option="berry" aria-pressed="false">
                <span></span>
                Berry
              </button>
              <button class="swatch swatch-sunrise" type="button" data-bg-option="sunrise" aria-pressed="false">
                <span></span>
                Sunrise
              </button>
              <button class="swatch swatch-mono" type="button" data-bg-option="mono" aria-pressed="false">
                <span></span>
                Mono
              </button>
            </div>
            <div class="custom-colour background-custom-colour">
              <label class="colour-picker-wrap">
                <span>Custom</span>
                <input id="custom-colour" type="color" value="#2dd4bf" aria-label="Custom background colour" />
              </label>
              <label class="hex-wrap">
                <span>Hex</span>
                <input
                  id="hex-colour"
                  type="text"
                  inputmode="text"
                  maxlength="7"
                  pattern="^#[0-9A-Fa-f]{6}$"
                  value="#2dd4bf"
                  aria-label="Hex background colour"
                />
              </label>
            </div>
          </fieldset>
          <fieldset class="color-settings">
            <legend>Game screen colour</legend>
            <div class="swatch-grid" id="panel-swatches">
              <button class="swatch swatch-black" type="button" data-panel-option="black" aria-pressed="false">
                <span></span>
                Black
              </button>
              <button class="swatch swatch-white" type="button" data-panel-option="white" aria-pressed="false">
                <span></span>
                White
              </button>
              <button class="swatch swatch-night" type="button" data-panel-option="night" aria-pressed="false">
                <span></span>
                Night
              </button>
              <button class="swatch swatch-forest" type="button" data-panel-option="forest" aria-pressed="false">
                <span></span>
                Forest
              </button>
              <button class="swatch swatch-ocean" type="button" data-panel-option="ocean" aria-pressed="false">
                <span></span>
                Ocean
              </button>
              <button class="swatch swatch-berry" type="button" data-panel-option="berry" aria-pressed="false">
                <span></span>
                Berry
              </button>
              <button class="swatch swatch-sunrise" type="button" data-panel-option="sunrise" aria-pressed="false">
                <span></span>
                Sunrise
              </button>
              <button class="swatch swatch-mono" type="button" data-panel-option="mono" aria-pressed="false">
                <span></span>
                Mono
              </button>
            </div>
            <div class="custom-colour panel-custom-colour">
              <label class="colour-picker-wrap">
                <span>Custom</span>
                <input id="panel-custom-colour" type="color" value="#151c2b" aria-label="Custom game screen colour" />
              </label>
              <label class="hex-wrap">
                <span>Hex</span>
                <input
                  id="panel-hex-colour"
                  type="text"
                  inputmode="text"
                  maxlength="7"
                  pattern="^#[0-9A-Fa-f]{6}$"
                  value="#151c2b"
                  aria-label="Hex game screen colour"
                />
              </label>
            </div>
          </fieldset>
        </form>
      </dialog>

      <dialog class="score-dialog" id="score-dialog" aria-labelledby="score-title">
        <form class="score-card" id="score-form">
          <div class="score-head">
            <h2 id="score-title">You cleared it</h2>
            <span id="score-time">000s</span>
          </div>
          <label class="score-name-wrap">
            <span>Leaderboard name</span>
            <input id="score-name" type="text" maxlength="16" autocomplete="nickname" required value="Player" />
          </label>
          <button class="save-score-button" type="submit">Save score</button>
        </form>
      </dialog>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
